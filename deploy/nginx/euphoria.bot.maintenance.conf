server {
    listen 80;
    listen [::]:80;
    server_name euphoria.bot www.euphoria.bot;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://euphoria.bot$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.euphoria.bot;

    ssl_certificate /etc/letsencrypt/live/euphoria.bot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/euphoria.bot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    return 301 https://euphoria.bot$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name euphoria.bot;

    ssl_certificate /etc/letsencrypt/live/euphoria.bot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/euphoria.bot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    types { }
    default_type "text/plain; charset=utf-8";
    add_header Retry-After "60" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    return 503 "Cometa is temporarily unavailable. Please try again shortly.\n";
}
