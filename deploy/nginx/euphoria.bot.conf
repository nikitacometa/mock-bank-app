# These zones are local to the euphoria.bot include. Their generous per-address
# budgets tolerate carrier-grade NAT while still bounding abusive bootstrap
# floods before they reach the bot worker.
limit_req_zone $binary_remote_addr zone=cometa_tma_bootstrap_per_ip:4m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=cometa_tma_bootstrap_conn_per_ip:1m;

server {
    listen 80;
    listen [::]:80;
    server_name euphoria.bot www.euphoria.bot;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://euphoria.bot$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.euphoria.bot;

    ssl_certificate /etc/letsencrypt/live/euphoria.bot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/euphoria.bot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    return 301 https://euphoria.bot$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name euphoria.bot;

    ssl_certificate /etc/letsencrypt/live/euphoria.bot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/euphoria.bot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.frankfurter.dev; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    root /var/www/euphoria.bot/current;
    index index.html;
    etag on;
    gzip_vary on;

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        expires 1y;
        try_files $uri =404;
    }

    location ~* ^/(?:assets/currencies|fonts)/ {
        expires -1;
        try_files $uri =404;
    }

    location = /api/tma/bootstrap {
        client_max_body_size 1k;
        limit_req zone=cometa_tma_bootstrap_per_ip burst=100 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        limit_conn cometa_tma_bootstrap_conn_per_ip 40;
        limit_conn_status 429;
        limit_conn_log_level warn;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $cometa_bot_upstream cometa-bank-bot;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Variable resolution keeps shared-proxy config valid while the bot is
        # stopped and follows a recreated container's new Docker IP.
        proxy_pass http://$cometa_bot_upstream:8787/bootstrap;
        add_header Cache-Control "no-store, private" always;
        # A location-level add_header cancels inheritance from the server block.
        # Repeat the relevant response hardening for this JSON endpoint.
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
