server_tokens off;

# Host ports are loopback-only and host Caddy overwrites X-Forwarded-For. Trust
# only loopback/private Docker gateways so a future HTTP upstream keeps real IPs.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name euphoria.bot www.euphoria.bot;

    root /usr/share/nginx/html;
    index index.html;
    etag on;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        expires 1y;
        try_files $uri =404;
    }

    location ~* ^/(?:assets/currencies|fonts)/ {
        expires -1;
        try_files $uri =404;
    }

    location ~ "^/app/[0-9]{8}T[0-9]{6}Z/$" {
        expires -1;
        try_files $uri/index.html /index.html =404;
    }

    location /app/ {
        return 404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
