server_tokens off;

server {
    listen 8080;
    server_name euphoria.bot www.euphoria.bot;

    root /usr/share/nginx/html;
    index index.html;
    etag on;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        expires 1y;
        try_files $uri =404;
    }

    location ~* ^/(?:assets/currencies|fonts)/ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
