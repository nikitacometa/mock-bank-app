server_tokens off;

# Host ports are loopback-only and host Caddy overwrites X-Forwarded-For. Docker
# may SNAT the local hop through a private bridge gateway; recover the real IP
# before applying the per-client zones below.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# These zones intentionally tolerate carrier-grade NAT while bounding floods
# before requests reach the single bot worker.
limit_req_zone $binary_remote_addr zone=cometa_tma_bootstrap_per_ip:4m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cometa_tma_command_per_ip:4m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cometa_tma_import_per_ip:4m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=cometa_tma_bootstrap_conn_per_ip:1m;

server {
    listen 8080;
    server_name euphoria.bot www.euphoria.bot;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://euphoria.bot$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name www.euphoria.bot;

    ssl_certificate /etc/letsencrypt/live/euphoria.bot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/euphoria.bot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    return 301 https://euphoria.bot$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name euphoria.bot;

    ssl_certificate /etc/letsencrypt/live/euphoria.bot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/euphoria.bot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.frankfurter.dev; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    root /usr/share/nginx/html;
    index index.html;
    etag on;
    gzip_vary on;

    location = /healthz {
        access_log off;
        return 204;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        expires 1y;
        try_files $uri =404;
    }

    location ~* ^/(?:assets/currencies|fonts)/ {
        expires -1;
        try_files $uri =404;
    }

    location = /api/tma/bootstrap {
        client_max_body_size 1k;
        limit_req zone=cometa_tma_bootstrap_per_ip burst=100 nodelay;
        limit_req_status 429;
        limit_conn cometa_tma_bootstrap_conn_per_ip 40;
        limit_conn_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $cometa_bot_upstream cometa-bank-bot;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://$cometa_bot_upstream:8787/bootstrap;

        add_header Cache-Control "no-store, private" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = /api/tma/bank-import {
        client_max_body_size 5m;
        limit_req zone=cometa_tma_import_per_ip burst=4 nodelay;
        limit_req_status 429;
        limit_conn cometa_tma_bootstrap_conn_per_ip 4;
        limit_conn_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $cometa_bot_upstream cometa-bank-bot;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://$cometa_bot_upstream:8787/bank-import;

        add_header Cache-Control "no-store, private" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = /api/tma/bank-command {
        client_max_body_size 64k;
        limit_req zone=cometa_tma_command_per_ip burst=30 nodelay;
        limit_req_status 429;
        limit_conn cometa_tma_bootstrap_conn_per_ip 12;
        limit_conn_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $cometa_bot_upstream cometa-bank-bot;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://$cometa_bot_upstream:8787/bank-command;

        add_header Cache-Control "no-store, private" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = /api/tma/bank-rates {
        client_max_body_size 1k;
        limit_req zone=cometa_tma_command_per_ip burst=30 nodelay;
        limit_req_status 429;
        limit_conn cometa_tma_bootstrap_conn_per_ip 12;
        limit_conn_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $cometa_bot_upstream cometa-bank-bot;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://$cometa_bot_upstream:8787/bank-rates;

        add_header Cache-Control "no-store, private" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ~ "^/app/[0-9]{8}T[0-9]{6}Z/$" {
        expires -1;
        try_files $uri/index.html /index.html =404;
    }

    location /app/ {
        return 404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
