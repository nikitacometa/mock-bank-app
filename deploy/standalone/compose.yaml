name: cometa-bank

services:
  web:
    image: cometa-bank-web:${COMETA_RELEASE_ID:?COMETA_RELEASE_ID is required}
    pull_policy: never
    build:
      context: ../..
      dockerfile: deploy/standalone/Web.Dockerfile
      args:
        COMETA_RELEASE_ID: ${COMETA_RELEASE_ID:?COMETA_RELEASE_ID is required}
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - type: bind
        source: ${COMETA_DEPLOY_ROOT:-/srv/cometa-bank}/state/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: acme-www
        target: /var/www/certbot
        read_only: true
      - type: volume
        source: letsencrypt
        target: /etc/letsencrypt
        read_only: true
    networks:
      - public
      - edge
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  bot:
    image: cometa-bank-bot:${COMETA_RELEASE_ID:?COMETA_RELEASE_ID is required}
    pull_policy: never
    build:
      context: ../..
      dockerfile: deploy/standalone/Bot.Dockerfile
      args:
        COMETA_RELEASE_ID: ${COMETA_RELEASE_ID:?COMETA_RELEASE_ID is required}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      BOT_TOKEN_FILE: /run/secrets/bot_token
      PUBLIC_WEB_APP_URL: https://euphoria.bot/
      DATA_PATH: /data/cometa-bank.sqlite
      PORT: "8787"
    volumes:
      - type: bind
        source: /etc/cometa-bank/secrets/bot_token
        target: /run/secrets/bot_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COMETA_DEPLOY_ROOT:-/srv/cometa-bank}/data
        target: /data
        bind:
          create_host_path: false
    networks:
      edge:
        aliases:
          - cometa-bank-bot
      egress: {}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.00
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  certbot:
    image: certbot/certbot:v5.3.1@sha256:8be9c9f10232e223acd84acdacc26858fcd46e8194c6dcdf99b2ddd231a362fe
    profiles:
      - tools
    volumes:
      - type: volume
        source: acme-www
        target: /var/www/certbot
      - type: volume
        source: letsencrypt
        target: /etc/letsencrypt
    networks:
      - egress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  public:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  edge:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
  egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"

volumes:
  acme-www:
  letsencrypt:
