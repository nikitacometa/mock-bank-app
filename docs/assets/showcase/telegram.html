<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Cometa · live Telegram companion</title>
<style>
@font-face{font-family:Geist;src:url('../../../public/fonts/Geist-Variable.woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
body{margin:0;width:1600px;height:1040px;background:#101116;color:#efeadd;font-family:Geist,Arial,sans-serif;overflow:hidden}
.backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.36;transform:scaleX(-1)}
main{position:relative;padding:56px 96px}
.brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:600;letter-spacing:-1px}.brand svg{width:26px;height:26px}
.eyebrow{position:absolute;right:96px;top:68px;font-size:14px;letter-spacing:2px;color:#a7abad;text-transform:uppercase}
header{display:flex;align-items:flex-end;justify-content:space-between;margin:32px 0 36px}
h1{font-size:57px;font-weight:500;line-height:1.07;letter-spacing:-2.8px;margin:0}
header p{font-size:19px;line-height:1.6;color:#a7abad;margin:0 0 4px;max-width:410px}
.screens{display:flex;justify-content:center;gap:44px}
figure{margin:0;width:390px}
figure img{display:block;width:390px;height:650px;border:1px solid #353b40;border-radius:24px;box-shadow:0 20px 48px #03050840}
figcaption{display:flex;gap:12px;align-items:center;font-size:17px;color:#dad9d1;margin-top:20px}
figcaption span{font-size:12px;letter-spacing:1px;color:#a7abad}
.footer{position:absolute;left:96px;right:96px;bottom:28px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.2px;color:#a7abad}
</style>
<img class="backdrop" src="backdrop.png" alt="">
<main>
  <div class="brand"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m11 17 11-11M8 13l7-7M16 17l7-7"/><circle cx="6" cy="22" r="3" fill="currentColor" stroke="none"/></svg>Cometa</div>
  <div class="eyebrow">Live Telegram companion</div>
  <header><h1>Your demo.<br>Your everyday rhythm.</h1><p>Add an entry. Tune an account.<br>Open the app and see it there.</p></header>
  <section class="screens" aria-label="Three real Telegram Web screenshots">
    <figure><img src="telegram-dashboard-real.png" alt="Live Cometa bot dashboard with income, expense, accounts and recurring controls"><figcaption><span>01</span>Add income or expenses</figcaption></figure>
    <figure><img src="telegram-recurring-real.png" alt="A monthly Spotify entry in the real Telegram chat"><figcaption><span>02</span>Keep subscriptions under control</figcaption></figure>
    <figure><img src="telegram-accounts-real.png" alt="Real Telegram account controls for adjusting a balance and reversibly closing an account"><figcaption><span>03</span>Adjust, close and restore accounts</figcaption></figure>
  </section>
</main>
<div class="footer"><span>Actual Telegram Web captures · private demo ledger</span><span>Mock entries only. No real money moves.</span></div>
<script type="module">
await document.fonts.ready;
await Promise.all(Array.from(document.images, image => image.decode()));
document.documentElement.dataset.ready = 'true';
</script>
</html>
