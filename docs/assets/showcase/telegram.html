<div class="brand"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m11 17 11-11M8 13l7-7M16 17l7-7"/><circle cx="6" cy="22" r="3" fill="currentColor" stroke="none"/></svg>Cometa</div><div class="eyebrow">Telegram companion · product preview</div>
<header><h1>Your demo.<br>Your everyday rhythm.</h1><p>Set it up in a chat.<br>Add the details that make it yours.</p></header><section class="screens" id="screens"></section></main>
<div class="footer"><span>Sanitized preview · exact bot-engine replies · illustrative Telegram layout</span><span>Mock entries only. No real money moves.</span></div>
<script type="module">
const preview=await fetch('./telegram-preview.json').then(response=>response.json());
const mark='<svg viewBox="0 0 28 28" fill="none" stroke="#f3ead6" stroke-width="1.7" stroke-linecap="round"><path d="m11 17 11-11M8 13l7-7M16 17l7-7"/><circle cx="6" cy="22" r="3" fill="#f3ead6" stroke="none"/></svg>';
for(const [index,frame] of preview.frames.entries()){
 const figure=document.createElement('figure');
 figure.innerHTML='<div class="frame'+(index===2?' account':'')+'"><div class="topbar"><span class="back">‹</span><div class="avatar">'+mark+'</div><div class="title">Cometa<div class="status">bot</div></div><span class="more">⋮</span></div><div class="chat"></div><div class="composer"><span class="menu">Menu</span><span>Message</span><span class="plus">+</span></div></div><figcaption><span>0'+(index+1)+'</span></figcaption>';
 const chat=figure.querySelector('.chat');
 for(const message of frame.messages){
  if(message.role==='user'){const incoming=document.createElement('div');incoming.className='incoming';incoming.textContent=message.text;chat.append(incoming);continue;}
  const group=document.createElement('div');const bubble=document.createElement('div');bubble.className='bubble';
  // Static, sanitized fixture captured from our production engine; only bold markup is allowed.
  const parts=message.textHtml.split(/(<b>|<\/b>)/);let target=bubble;
  for(const part of parts){if(part==='<b>'){const bold=document.createElement('b');bubble.append(bold);target=bold;}else if(part==='</b>'){target=bubble;}else target.append(document.createTextNode(part));}
  group.append(bubble);const keys=document.createElement('div');keys.className='keyboard';
  for(const row of message.keyboard??[]){const element=document.createElement('div');element.className='row';for(const button of row){const key=document.createElement('div');key.className='key'+(button.kind==='web_app'?' launch':'');key.textContent=button.text;element.append(key);}keys.append(element);}
  group.append(keys);chat.append(group);
 }
 figure.querySelector('figcaption').append(document.createTextNode(frame.title));document.querySelector('#screens').append(figure);
}
document.documentElement.dataset.ready='true';
</script></html>
